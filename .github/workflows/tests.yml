name: Tests and package build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Configure isolated browser directory
        shell: python
        run: |
          import os
          from pathlib import Path
          browser_path = Path(os.environ["RUNNER_TEMP"]) / "seo-audit-browsers"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"PLAYWRIGHT_BROWSERS_PATH={browser_path}\n")
      - name: Install locked runtime and test tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
          python -m pip install pytest build pip-audit
          python -m pip check
      - name: Install browser and Linux dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m playwright install --with-deps chromium
      - name: Install browser on Windows
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.13'
        run: python -m playwright install chromium
      - name: Allow sandbox user namespaces for the installed browser only
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          # Chromium's per-executable AppArmor guidance; keep its sandbox enabled.
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          browser_root = Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"]).resolve(strict=True)
          executables = sorted({path.resolve(strict=True)
                                for name in ("chrome", "chrome-headless-shell", "headless_shell")
                                for path in browser_root.rglob(name) if path.is_file()})
          names = {path.name for path in executables}
          if "chrome" not in names or not names.intersection({"chrome-headless-shell", "headless_shell"}):
              raise RuntimeError("Both installed Chromium executables must be present before granting userns.")
          profiles = ["abi <abi/4.0>,\ninclude <tunables/global>\n"]
          for index, executable in enumerate(executables):
              if browser_root not in executable.parents or not re.fullmatch(r"[A-Za-z0-9_./-]+", str(executable)):
                  raise RuntimeError("Browser executable must have a literal path within the dedicated install directory.")
              profiles.append(f'profile seo-audit-playwright-{index} "{executable}" flags=(unconfined) {{\n  userns,\n}}\n')
              print(f"Allowing sandbox user namespaces for {executable}")
          Path(os.environ["RUNNER_TEMP"], "seo-audit-playwright.apparmor").write_text("\n".join(profiles), encoding="utf-8")
          PY
          sudo install -m 0644 "$RUNNER_TEMP/seo-audit-playwright.apparmor" /etc/apparmor.d/seo-audit-playwright
          sudo apparmor_parser --replace /etc/apparmor.d/seo-audit-playwright
      - name: Run regression tests with real local HTTP and MCP
        env:
          SEO_AUDIT_TEST_BROWSER: ${{ matrix.python-version == '3.13' && '1' || '0' }}
        run: python -m pytest -q
      - name: Remove the temporary browser AppArmor profile
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          if [ -f /etc/apparmor.d/seo-audit-playwright ]; then
            sudo apparmor_parser --remove /etc/apparmor.d/seo-audit-playwright
            sudo rm /etc/apparmor.d/seo-audit-playwright
          fi
      - name: Audit locked runtime dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m pip_audit --require-hashes -r requirements.lock
      - name: Build and validate distributions
        run: |
          python -m build
          python -m pip install twine
          python -m twine check dist/*
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build nonroot container
        run: docker build -t seo-audit:test .
      - name: Verify package and safe defaults
        run: >-
          docker run --rm --entrypoint python seo-audit:test -c
          "import os,gsc_server; assert os.getuid()!=0; assert len(gsc_server.mcp._tool_manager._tools)==43; assert not gsc_server.ENABLE_WRITE_TOOLS; assert not gsc_server.ALLOW_PRIVATE_URLS"
