name: Tests and package build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime and test tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
          python -m pip install pytest build pip-audit
          python -m pip check
      - name: Install browser for integration tests
        if: matrix.python-version == '3.13'
        run: python -m playwright install --with-deps chromium
      - name: Run regression tests with real local HTTP and MCP
        env:
          SEO_AUDIT_TEST_BROWSER: ${{ matrix.python-version == '3.13' && '1' || '0' }}
        run: python -m pytest -q
      - name: Audit locked runtime dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m pip_audit --require-hashes -r requirements.lock
      - name: Build and validate distributions
        run: |
          python -m build
          python -m pip install twine
          python -m twine check dist/*
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build nonroot container
        run: docker build -t seo-audit:test .
      - name: Verify package and safe defaults
        run: >-
          docker run --rm --entrypoint python seo-audit:test -c
          "import os,gsc_server; assert os.getuid()!=0; assert len(gsc_server.mcp._tool_manager._tools)==43; assert not gsc_server.ENABLE_WRITE_TOOLS; assert not gsc_server.ALLOW_PRIVATE_URLS"
