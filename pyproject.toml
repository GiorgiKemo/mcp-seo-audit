[project]
name = "mcp-seo-audit"
version = "2.1.0"
description = "SEO audit & indexing MCP server — Google Search Console, Indexing API, Core Web Vitals, and site analysis tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Amin Foroutan", email = "aio@aminforoutan.com"},
    {name = "GiorgiKemo"}
]
keywords = ["mcp", "google search console", "seo", "claude", "search analytics", "indexing api", "core web vitals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "google-api-python-client>=2.163.0",
    "google-auth>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "mcp[cli]>=1.28.1,<2",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.63.0,<2"]
dev = [
    "pytest>=9.0.0",
    "build>=1.5.0",
    "pip-audit>=2.10.1",
]

[project.scripts]
mcp-seo-audit = "gsc_server:main"
mcp-seo-monitor = "seo_monitoring:main"

[project.urls]
"Homepage" = "https://github.com/GiorgiKemo/mcp-seo-audit"
"Source" = "https://github.com/GiorgiKemo/mcp-seo-audit"
"Bug Tracker" = "https://github.com/GiorgiKemo/mcp-seo-audit/issues"
"Release Notes" = "https://github.com/GiorgiKemo/mcp-seo-audit/releases"

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gsc_server", "seo_robots", "seo_reporting", "seo_google", "seo_network", "seo_rendering", "seo_sitemaps", "seo_diagnostics", "seo_storage", "seo_monitoring"]

